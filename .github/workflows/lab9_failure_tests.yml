name: Mushroom Failure Handling Tests

on:
  push:
    branches: [main, master]
    paths:
      - "config.yaml"
      - "src/mushroom_classification/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-api.txt"
      - "api/**"
      - "src/mlops_pipeline/**"
      - "data/raw/mushroom.csv"
      - ".github/workflows/lab9_failure_tests.yml"
  pull_request:
    paths:
      - "config.yaml"
      - "src/mushroom_classification/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-api.txt"
      - "api/**"
      - "src/mlops_pipeline/**"
      - "data/raw/mushroom.csv"
      - ".github/workflows/lab9_failure_tests.yml"
  workflow_dispatch:

jobs:
  lab9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Train local model required by API regression tests
        run: python -m src.mushroom_classification train
      - name: Run mushroom failure-handling tests
        run: python -m unittest discover -s tests -v
      - name: Run isolated failure injection
        run: python src/mlops_pipeline/10_failure_injection.py
