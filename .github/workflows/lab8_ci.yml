name: Mushroom Classification CI

on:
  push:
    branches: [main, master]
    paths:
      - "config.yaml"
      - "src/mushroom_classification/**"
      - "src/model_registry.py"
      - "src/validate.py"
      - "src/generate_registry_report.py"
      - "src/__init__.py"
      - "pipelines/run_mushroom_pipeline.py"
      - "tests/**"
      - "requirements.txt"
      - "requirements-api.txt"
      - "Dockerfile"
      - "deployment/**"
      - "k8s/**"
      - "api/**"
      - "src/mlops_pipeline/**"
      - "deployment/Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "data/raw/mushroom.csv"
      - ".github/workflows/lab8_ci.yml"
  pull_request:
    paths:
      - "config.yaml"
      - "src/mushroom_classification/**"
      - "src/model_registry.py"
      - "src/validate.py"
      - "src/generate_registry_report.py"
      - "src/__init__.py"
      - "pipelines/run_mushroom_pipeline.py"
      - "tests/**"
      - "requirements.txt"
      - "requirements-api.txt"
      - "Dockerfile"
      - "deployment/**"
      - "k8s/**"
      - "api/**"
      - "src/mlops_pipeline/**"
      - "deployment/Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "data/raw/mushroom.csv"
      - ".github/workflows/lab8_ci.yml"
  workflow_dispatch:

jobs:
  mlops-ci:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///artifacts/mlflow.db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run mushroom training and evaluation
        run: python -m src.mushroom_classification train

      - name: Run mushroom tests
        run: python -m unittest discover -s tests -v

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab8-ci-${{ github.run_number }}
          path: |
            artifacts/**
            reports/**
            outputs/**
            models/**
            mlruns/**
          if-no-files-found: ignore
