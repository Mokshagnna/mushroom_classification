apiVersion: apps/v1
kind: Deployment
metadata:
  name: mushroom-classification-api
  labels:
    app: mushroom-classification-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mushroom-classification-api
  template:
    metadata:
      labels:
        app: mushroom-classification-api
    spec:
      containers:
        - name: mushroom-api
          image: mushroom-classification:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MUSHROOM_MODEL_PATH
              value: /app/models/mushroom_classifier.joblib
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
